# Local development only. Not used by the Vercel deploy or any other environment.
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback only; the host port is configurable because a
      # Postgres installed on the host may already use 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      # Inside the container `localhost` is the container itself, so the
      # database is reached by its service name. This takes precedence over
      # any DATABASE_URL in a mounted .env file.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    volumes:
      - .:/app
      # Keep the container's own dependencies, build cache and Prisma client
      # instead of the host's.
      - /app/node_modules
      - /app/.next
      - /app/src/generated/prisma
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
